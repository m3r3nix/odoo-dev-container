services:
  workspace:
    image: ghcr.io/m3r3nix/odoo-v19-devcontainer:latest

    # Network configuration to be able to access other containers in the same network for API calls
    networks:
      default:
      dev-shared:
        aliases:
          - odoo-v19-devcontainer

    depends_on:
      db:
        condition: service_healthy
    environment:
      ODOO_DB_HOST: db
      ODOO_DB_PORT: "5432"
      ODOO_DB_USER: odoo
      ODOO_DB_PASSWORD: odoo
      ODOO_RC: /etc/odoo/odoo.conf
      ODOO_EXTRA_ARGS: --dev=xml,reload,werkzeug
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      WORKSPACES_DIR: /home/${USER}/workspaces
    volumes:
      - /home/${USER}/.codex:/home/odoo/.codex
      - ../:/home/${USER}/workspaces/repo
      - ../../odoo_source/odoo:/home/${USER}/workspaces/odoo_source/odoo
      - ../../odoo_source/enterprise:/home/${USER}/workspaces/odoo_source/enterprise
      - ../../odoo_source/filestore:/home/${USER}/workspaces/odoo_source/filestore
      - ./configs/odoo.conf:/tmp/odoo.conf.template:ro
      - ./configs/supervisord.conf:/etc/supervisor/supervisord.conf:ro
      - ./scripts/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./scripts/odoo-paths.sh:/usr/local/bin/odoo-paths.sh:ro
      - ./scripts/pull-sources.sh:/usr/local/bin/pull-sources.sh:ro
      - ./scripts/run-odoo.sh:/usr/local/bin/run-odoo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8069/web/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  db:
    image: pgvector/pgvector:pg16-trixie # PostgreSQL extension 'vector' is required to enable RAG for AI agents in Odoo 19.
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - odoo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  dev-shared:
    external: true

volumes:
  odoo_db:
